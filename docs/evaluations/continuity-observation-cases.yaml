schema_version: 1
cases:
  - id: clarification-return
    context: 已用订单页解释数据变化如何影响界面；主课未完问题是怎样组织多处显示更新。
    turns:
      - 这里传进去的是函数还是执行后的结果？
      - 明白，继续。
    criteria:
      - 先直接解释函数值与调用，不默认用户已会相关语法。
      - 续课通过例子返回多处显示更新的问题，不自动增加无关按钮题。
      - 不将答疑结束或明白登记成独立掌握。
  - id: simplify-preserve
    context: 已确认按问题与有来源的发展过程学习；正在用一个完整例子说明数据库事务。
    turns:
      - 太复杂了，用直白的话解释。
      - 继续讲它为什么需要这样设计。
    criteria:
      - 简化概念层次和表达，保留解释所必需的前提。
      - 保留原主问题；历史依据不足时说明缺口，不补造动机或事故。
      - 不用每轮固定小测或重复完整年表代替连贯解释。
  - id: explicit-redirection
    context: 正在解释事务与并发；此前有明确的历史路线和一个未完成例子。
    turns:
      - 先停一下，帮我理解这条 SQL 报错，不讲历史。
      - 继续看这个错误。
    criteria:
      - 持续遵守当前排错范围，不强制返回历史主课。
      - 保留未完主问题，将临时暂停与永久改线区分。
      - 不把排错或教学设计活动记录成主题掌握。
  - id: interruption-resume
    context: 合成任务已解释提交、任务记录与 Worker；当前分支是响应丢失，返回点是后续查询。
    turns:
      - 今天先到这里，后面再继续。
      - 继续学习。
    criteria:
      - 停止时保存准确位置，不虚构学习时间或能力结果。
      - 在新的上下文通过同一 resolver 恢复主课、分支与返回点。
      - 不因复习提示或旧 session 覆盖有效导航。
